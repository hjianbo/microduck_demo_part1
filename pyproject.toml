[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "microduck-demo-part1"
version = "0.1.0"
description = "A reproducible MQTT-controlled Microduck MuJoCo demo"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "numpy>=2,<3",
    "paho-mqtt==2.1.0",
]

[project.scripts]
microduck-send = "microduck_demo.send_velocity:main"
microduck-session = "microduck_demo.show_session:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.build-backend]
module-name = "microduck_demo"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
